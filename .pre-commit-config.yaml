repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: docmergeforge-doc-links
        name: DocMergeForge documentation link integrity
        entry: python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        files: \.md$
      - id: docmergeforge-repository-reference
        name: DocMergeForge repository documentation coverage
        entry: python scripts/check_repository_reference.py
        language: system
        pass_filenames: false
        always_run: true
