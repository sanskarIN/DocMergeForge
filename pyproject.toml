[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docmergeforge"
version = "0.1.0"
description = "Local-first, validation-driven PDF and DOCX merger for large multi-part publications."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Sanskar", email = "sanskarin@outlook.in"}]
keywords = ["pdf", "docx", "merge", "ebook", "publishing", "pyside6"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = [
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "docxcompose>=1.4,<2",
  "PySide6>=6.8,<7",
  "reportlab>=4.2,<5",
]

[project.urls]
Homepage = "https://github.com/sanskarIN/DocMergeForge"
Repository = "https://github.com/sanskarIN/DocMergeForge"
Documentation = "https://github.com/sanskarIN/DocMergeForge/tree/main/docs"
Issues = "https://github.com/sanskarIN/DocMergeForge/issues"
Funding = "https://buymeacoffee.com/sanskarIN"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
  "black>=25.1",
  "mypy>=1.15",
  "pre-commit>=4",
  "types-setuptools",
]
build = [
  "pyinstaller>=6.12",
  "cyclonedx-bom==7.3.1",
]

[project.scripts]
docmergeforge = "docmergeforge.cli.main:main"
docmergeforge-gui = "docmergeforge.ui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docmergeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests requiring document libraries",
  "regression: larger synthetic regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["docmergeforge"]
mypy_path = "src"
warn_unused_ignores = true
