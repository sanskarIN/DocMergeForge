[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docmergeforge"
version = "0.1.0"
description = "Local-first, validation-driven PDF and DOCX merger for large multi-part publications."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Sanskar"}]
keywords = ["pdf", "docx", "merge", "ebook", "publishing", "pyside6"]
dependencies = [
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "docxcompose>=1.4,<2",
  "PySide6>=6.8,<7",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
  "black>=25.1",
  "mypy>=1.15",
  "pre-commit>=4",
  "types-setuptools",
]
build = ["pyinstaller>=6.12"]

[project.scripts]
docmergeforge = "docmergeforge.cli.main:main"
docmergeforge-gui = "docmergeforge.ui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docmergeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests requiring document libraries",
  "regression: larger synthetic regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["docmergeforge"]
mypy_path = "src"
warn_unused_ignores = true
