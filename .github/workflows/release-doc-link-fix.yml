name: Release Documentation Link Fix

on:
  push:
    branches: [release-ready-0.1.0]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-ready-0.1.0
      - name: Fix archived history link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/history/what_changed-through-2026-08-20-cross-platform.md')
          text = path.read_text(encoding='utf-8')
          old = '[`docs/history/what_changed-through-2026-08-18.md`](docs/history/what_changed-through-2026-08-18.md)'
          new = '[`what_changed-through-2026-08-18.md`](what_changed-through-2026-08-18.md)'
          if old not in text:
              raise SystemExit('expected historical link not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot helper
        run: git rm .github/workflows/release-doc-link-fix.yml
      - name: Commit corrected documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/history/what_changed-through-2026-08-20-cross-platform.md
          git commit -m "docs: fix archived history link"
          git push origin HEAD:release-ready-0.1.0
