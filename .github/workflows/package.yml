name: Package Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install project and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Validate desktop packaging configuration
        run: python scripts/build_desktop.py --check

      - name: Build desktop application
        run: python scripts/build_desktop.py

      - name: Launch-test Windows packaged application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process \
            -FilePath "dist/DocMergeForge/DocMergeForge.exe" \
            -ArgumentList "--packaged-smoke" \
            -Wait \
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke failed with exit code $($process.ExitCode)"
          }

      - name: Launch-test macOS packaged application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -x "dist/DocMergeForge.app/Contents/MacOS/DocMergeForge" ]; then
            executable="dist/DocMergeForge.app/Contents/MacOS/DocMergeForge"
          elif [ -x "dist/DocMergeForge/DocMergeForge" ]; then
            executable="dist/DocMergeForge/DocMergeForge"
          else
            echo "Could not locate packaged macOS executable" >&2
            find dist -maxdepth 5 -type f -print
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen "$executable" --packaged-smoke

      - name: Launch-test Linux packaged application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen dist/DocMergeForge/DocMergeForge --packaged-smoke

      - name: Archive Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DocMergeForge/* -DestinationPath DocMergeForge-Windows-unsigned.zip

      - name: Archive macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "dist/DocMergeForge.app" ]; then
            tar -czf DocMergeForge-macOS-unsigned.tar.gz -C dist DocMergeForge.app
          else
            tar -czf DocMergeForge-macOS-unsigned.tar.gz -C dist DocMergeForge
          fi

      - name: Archive Linux artifact
        if: runner.os == 'Linux'
        run: tar -czf DocMergeForge-Linux-unsigned.tar.gz -C dist DocMergeForge

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DocMergeForge-Windows-unsigned
          path: DocMergeForge-Windows-unsigned.zip
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DocMergeForge-macOS-unsigned
          path: DocMergeForge-macOS-unsigned.tar.gz
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DocMergeForge-Linux-unsigned
          path: DocMergeForge-Linux-unsigned.tar.gz
          if-no-files-found: error

      - name: Packaging notice
        run: >-
          echo "These CI artifacts are unsigned development builds. Code signing and notarization
          must be configured with platform credentials before production distribution."
