name: LibreOffice Native Merge Acceptance

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Per-run LibreOffice UNO merge timeout in seconds
        required: false
        default: "300"
  push:
    branches: [main]
    paths:
      - "src/docmergeforge/docx/libreoffice.py"
      - "src/docmergeforge/docx/libreoffice_merge.py"
      - "src/docmergeforge/docx/libreoffice_merge_acceptance.py"
      - "scripts/check_libreoffice_native_merge_smoke.py"
      - "tests/unit/test_docx_libreoffice*.py"
      - "tests/integration/test_libreoffice_native_merge_smoke_script.py"
      - ".github/workflows/libreoffice-native-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice-native-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice Writer and Python UNO bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer python3-uno
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify LibreOffice fidelity capability separation
        run: docmergeforge fidelity-capabilities
      - name: Verify system Python UNO bridge
        run: /usr/bin/python3 -c "import uno; print(uno.__file__)"
      - name: Run LibreOffice native merge boundary tests
        run: |
          pytest \
            tests/unit/test_docx_libreoffice.py \
            tests/unit/test_docx_libreoffice_merge.py \
            tests/unit/test_docx_libreoffice_merge_acceptance.py \
            tests/integration/test_libreoffice_native_merge_smoke_script.py
      - name: Run real LibreOffice UNO multi-document merge smoke
        run: |
          python scripts/check_libreoffice_native_merge_smoke.py \
            --output-dir libreoffice-native-evidence \
            --timeout "${{ inputs.timeout_seconds || '300' }}"
      - name: Display measured LibreOffice native evidence
        if: always()
        run: |
          if [ -f libreoffice-native-evidence/libreoffice-native-merge-evidence.json ]; then
            cat libreoffice-native-evidence/libreoffice-native-merge-evidence.json
          else
            echo "LibreOffice native merge evidence was not produced."
          fi
      - name: Upload LibreOffice native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libreoffice-native-merge-acceptance-evidence
          path: libreoffice-native-evidence/
          if-no-files-found: error
          retention-days: 14
