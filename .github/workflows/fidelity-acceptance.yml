name: DOCX Fidelity Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/docmergeforge/docx/**"
      - "src/docmergeforge/validation/ooxml.py"
      - "scripts/check_docx_fidelity_acceptance.py"
      - "scripts/check_word_native_merge_acceptance.py"
      - "scripts/check_word_native_merge_smoke.py"
      - "scripts/check_word_timeout_cleanup_acceptance.py"
      - "scripts/check_word_process_state.ps1"
      - "scripts/report_word_acceptance_environment.ps1"
      - "tests/unit/test_docx_*.py"
      - "tests/unit/test_cli_fidelity.py"
      - "tests/unit/test_ooxml_*.py"
      - "tests/unit/test_word_acceptance_environment_script.py"
      - "tests/unit/test_word_native_acceptance_workflow.py"
      - "tests/unit/test_word_process_state_script.py"
      - "tests/integration/test_word_native_merge_acceptance_script.py"
      - "tests/integration/test_word_native_merge_smoke_script.py"
      - "tests/integration/test_word_timeout_cleanup_acceptance_script.py"
      - ".github/workflows/fidelity-acceptance.yml"
      - ".github/workflows/word-native-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Verify fidelity capability separation
        run: docmergeforge fidelity-capabilities
      - name: Run fidelity-focused automated tests
        run: |
          pytest \
            tests/unit/test_docx_native.py \
            tests/unit/test_docx_libreoffice.py \
            tests/unit/test_docx_word.py \
            tests/unit/test_docx_word_merge.py \
            tests/unit/test_docx_word_merge_cleanup_failure.py \
            tests/unit/test_docx_word_process.py \
            tests/unit/test_docx_fidelity.py \
            tests/unit/test_docx_fidelity_acceptance.py \
            tests/unit/test_docx_fidelity_corpus.py \
            tests/unit/test_docx_section_evidence.py \
            tests/unit/test_docx_word_merge_acceptance.py \
            tests/unit/test_docx_word_merge_page_number_acceptance.py \
            tests/unit/test_cli_fidelity.py \
            tests/unit/test_ooxml_risk.py \
            tests/unit/test_word_acceptance_environment_script.py \
            tests/unit/test_word_native_acceptance_workflow.py \
            tests/unit/test_word_process_state_script.py \
            tests/integration/test_word_native_merge_acceptance_script.py \
            tests/integration/test_word_native_merge_smoke_script.py \
            tests/integration/test_word_timeout_cleanup_acceptance_script.py
      - name: Run real LibreOffice round-trip acceptance
        run: |
          python scripts/check_docx_fidelity_acceptance.py \
            --mode libreoffice \
            --output-dir fidelity-evidence
      - name: Show measured evidence
        run: cat fidelity-evidence/fidelity-libreoffice-evidence.json
      - name: Upload fidelity evidence
        uses: actions/upload-artifact@v7
        with:
          name: docx-libreoffice-fidelity-evidence
          path: fidelity-evidence/
          if-no-files-found: error
          retention-days: 14
