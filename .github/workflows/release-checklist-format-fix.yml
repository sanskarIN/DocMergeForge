name: Release Checklist Formatter Fix

on:
  push:
    branches: [release-ready-0.1.0]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-ready-0.1.0
      - name: Align release checklist with Ruff formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/build/release-checklist.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] Black green.'
          new = '- [ ] Ruff formatting green.'
          if old not in text:
              raise SystemExit('expected Black checklist entry not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot helper
        run: git rm .github/workflows/release-checklist-format-fix.yml
      - name: Commit corrected checklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/build/release-checklist.md
          git commit -m "docs: align release checklist with Ruff formatter"
          git push origin HEAD:release-ready-0.1.0
