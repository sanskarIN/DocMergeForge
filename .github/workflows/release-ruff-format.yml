name: Release Ruff Format

on:
  push:
    branches: [release-ready-0.1.0]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-ready-0.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.3
      - name: Apply canonical repository formatting
        run: ruff format .
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Repository is already Ruff-formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize repository with Ruff formatter"
          git push origin HEAD:release-ready-0.1.0
