name: Microsoft Word Native Acceptance

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Per-run Word native merge timeout in seconds
        required: false
        default: "900"
      timeout_cleanup_seconds:
        description: Seconds before the controlled Word cleanup test must time out
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  word-native-merge:
    runs-on: [self-hosted, Windows, X64, docmergeforge-word]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Record Windows and Microsoft Word environment
        shell: powershell
        run: |
          .\scripts\report_word_acceptance_environment.ps1 `
            -Output "word-merge-evidence\word-environment.json"
      - name: Record and verify Word fidelity capability policy
        shell: powershell
        run: |
          $capabilityJson = docmergeforge fidelity-capabilities
          $capabilityJson | Set-Content `
            -LiteralPath "word-merge-evidence\fidelity-capabilities.json" `
            -Encoding UTF8
          $capabilities = @($capabilityJson | ConvertFrom-Json)
          $word = $capabilities | Where-Object { $_.mode -eq "word" }
          if ($null -eq $word) {
            throw "Word fidelity capability was not reported."
          }
          if (-not $word.automation_ready) {
            throw "Word fidelity automation is not ready on the controlled runner."
          }
          if ($word.production_ready) {
            throw "Word fidelity mode must remain production_ready=false during acceptance."
          }
          $capabilityJson
      - name: Require clean Word process state before acceptance
        id: word_process_before
        continue-on-error: true
        shell: powershell
        run: |
          .\scripts\check_word_process_state.ps1 `
            -Phase before `
            -Output "word-merge-evidence\word-process-before.json"
      - name: Run Word boundary tests
        if: steps.word_process_before.outcome == 'success'
        shell: powershell
        run: |
          pytest `
            tests/unit/test_docx_word.py `
            tests/unit/test_docx_word_merge.py `
            tests/unit/test_docx_word_process.py `
            tests/unit/test_docx_section_evidence.py `
            tests/unit/test_docx_word_merge_acceptance.py `
            tests/unit/test_docx_word_merge_page_number_acceptance.py `
            tests/unit/test_word_acceptance_environment_script.py `
            tests/unit/test_word_process_state_script.py `
            tests/integration/test_word_native_merge_acceptance_script.py `
            tests/integration/test_word_native_merge_smoke_script.py `
            tests/integration/test_word_timeout_cleanup_acceptance_script.py
      - name: Run real Microsoft Word native merge smoke
        id: word_smoke
        if: steps.word_process_before.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          python scripts/check_word_native_merge_smoke.py `
            --output-dir word-merge-evidence `
            --timeout "${{ inputs.timeout_seconds }}"
      - name: Run real Microsoft Word timeout cleanup acceptance
        id: word_timeout_cleanup
        if: steps.word_process_before.outcome == 'success' && steps.word_smoke.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $timeout = [int]"${{ inputs.timeout_cleanup_seconds }}"
          $holdSeconds = $timeout + 120
          python scripts/check_word_timeout_cleanup_acceptance.py `
            --output-dir word-merge-evidence `
            --timeout $timeout `
            --hold-seconds $holdSeconds
      - name: Require clean Word process state after acceptance
        id: word_process_after
        if: always() && steps.word_process_before.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          .\scripts\check_word_process_state.ps1 `
            -Phase after `
            -Output "word-merge-evidence\word-process-after.json"
      - name: Display environment evidence
        if: always()
        shell: powershell
        run: |
          if (Test-Path word-merge-evidence\word-environment.json) {
            Get-Content word-merge-evidence\word-environment.json
          }
          else {
            Write-Warning "Word environment evidence was not produced."
          }
      - name: Display capability evidence
        if: always()
        shell: powershell
        run: |
          if (Test-Path word-merge-evidence\fidelity-capabilities.json) {
            Get-Content word-merge-evidence\fidelity-capabilities.json
          }
          else {
            Write-Warning "Word capability evidence was not produced."
          }
      - name: Display process-state evidence
        if: always()
        shell: powershell
        run: |
          foreach ($name in @("word-process-before.json", "word-process-after.json")) {
            $path = Join-Path "word-merge-evidence" $name
            if (Test-Path $path) {
              Get-Content $path
            }
            else {
              Write-Warning "$name was not produced."
            }
          }
      - name: Display merge evidence
        if: always()
        shell: powershell
        run: |
          if (Test-Path word-merge-evidence\word-native-merge-evidence.json) {
            Get-Content word-merge-evidence\word-native-merge-evidence.json
          }
          else {
            Write-Warning "Word native merge evidence was not produced."
          }
      - name: Display timeout cleanup evidence
        if: always()
        shell: powershell
        run: |
          if (Test-Path word-merge-evidence\word-timeout-cleanup-evidence.json) {
            Get-Content word-merge-evidence\word-timeout-cleanup-evidence.json
          }
          else {
            Write-Warning "Word timeout cleanup evidence was not produced."
          }
      - name: Upload Word acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microsoft-word-native-acceptance-evidence
          path: word-merge-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce controlled Word acceptance result
        if: always()
        shell: powershell
        run: |
          if ("${{ steps.word_process_before.outcome }}" -ne "success") {
            Write-Error "Controlled Word runner was not clean before acceptance."
            exit 1
          }
          if ("${{ steps.word_smoke.outcome }}" -ne "success") {
            Write-Error "Microsoft Word native merge smoke did not pass measured acceptance."
            exit 1
          }
          if ("${{ steps.word_timeout_cleanup.outcome }}" -ne "success") {
            Write-Error "Microsoft Word timeout cleanup acceptance did not pass."
            exit 1
          }
          if ("${{ steps.word_process_after.outcome }}" -ne "success") {
            Write-Error "Microsoft Word process cleanup acceptance failed."
            exit 1
          }
