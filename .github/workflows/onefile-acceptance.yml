name: Onefile Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/onefile-acceptance.yml"
      - "pyproject.toml"
      - "scripts/build_desktop.py"
      - "src/docmergeforge/packaging/**"
      - "src/docmergeforge/ui/**"

permissions:
  contents: read

jobs:
  build-onefile:
    name: build onefile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install project and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Validate desktop packaging configuration
        run: python scripts/build_desktop.py --check

      - name: Build onefile desktop application
        run: python scripts/build_desktop.py --one-file

      - name: Launch-test Windows onefile application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/DocMergeForge.exe" -ArgumentList "--packaged-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows onefile smoke failed with exit code $($process.ExitCode)"
          }

      - name: Launch-test macOS onefile application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -x "dist/DocMergeForge.app/Contents/MacOS/DocMergeForge" ]; then
            executable="dist/DocMergeForge.app/Contents/MacOS/DocMergeForge"
          elif [ -x "dist/DocMergeForge" ]; then
            executable="dist/DocMergeForge"
          else
            echo "Could not locate macOS onefile executable" >&2
            find dist -maxdepth 5 -type f -print
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen "$executable" --packaged-smoke

      - name: Launch-test Linux onefile application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen dist/DocMergeForge --packaged-smoke

      - name: Archive Windows onefile artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DocMergeForge.exe -DestinationPath DocMergeForge-Windows-onefile-unsigned.zip

      - name: Archive macOS onefile artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "dist/DocMergeForge.app" ]; then
            tar -czf DocMergeForge-macOS-onefile-unsigned.tar.gz -C dist DocMergeForge.app
          else
            tar -czf DocMergeForge-macOS-onefile-unsigned.tar.gz -C dist DocMergeForge
          fi

      - name: Archive Linux onefile artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf DocMergeForge-Linux-onefile-unsigned.tar.gz -C dist DocMergeForge

      - name: Hash Windows onefile artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = "DocMergeForge-Windows-onefile-unsigned.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -Encoding ascii "$file.sha256"

      - name: Hash macOS onefile artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shasum -a 256 DocMergeForge-macOS-onefile-unsigned.tar.gz > DocMergeForge-macOS-onefile-unsigned.tar.gz.sha256
          shasum -a 256 -c DocMergeForge-macOS-onefile-unsigned.tar.gz.sha256

      - name: Hash Linux onefile artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sha256sum DocMergeForge-Linux-onefile-unsigned.tar.gz > DocMergeForge-Linux-onefile-unsigned.tar.gz.sha256
          sha256sum -c DocMergeForge-Linux-onefile-unsigned.tar.gz.sha256

      - name: Upload Windows onefile artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DocMergeForge-Windows-onefile-unsigned
          path: |
            DocMergeForge-Windows-onefile-unsigned.zip
            DocMergeForge-Windows-onefile-unsigned.zip.sha256
          if-no-files-found: error

      - name: Upload macOS onefile artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DocMergeForge-macOS-onefile-unsigned
          path: |
            DocMergeForge-macOS-onefile-unsigned.tar.gz
            DocMergeForge-macOS-onefile-unsigned.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Linux onefile artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DocMergeForge-Linux-onefile-unsigned
          path: |
            DocMergeForge-Linux-onefile-unsigned.tar.gz
            DocMergeForge-Linux-onefile-unsigned.tar.gz.sha256
          if-no-files-found: error

  fresh-runner-onefile:
    name: fresh onefile (${{ matrix.os }})
    needs: build-onefile
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DocMergeForge-Windows-onefile-unsigned
            archive: DocMergeForge-Windows-onefile-unsigned.zip
          - os: macos-latest
            artifact: DocMergeForge-macOS-onefile-unsigned
            archive: DocMergeForge-macOS-onefile-unsigned.tar.gz
          - os: ubuntu-latest
            artifact: DocMergeForge-Linux-onefile-unsigned
            archive: DocMergeForge-Linux-onefile-unsigned.tar.gz

    steps:
      - name: Download onefile artifact only
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact

      - name: Install Linux runtime prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Verify and launch Windows downloaded onefile
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path "artifact" "${{ matrix.archive }}"
          $expected = ((Get-Content "$archive.sha256").Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Downloaded Windows onefile archive SHA-256 mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath "extracted"
          $exe = Get-ChildItem -Path "extracted" -Recurse -Filter "DocMergeForge.exe" | Select-Object -First 1
          if ($null -eq $exe) {
            throw "Could not locate downloaded Windows onefile executable"
          }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--packaged-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Fresh-runner Windows onefile smoke failed with exit code $($process.ExitCode)"
          }

      - name: Verify and launch macOS downloaded onefile
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd artifact
          shasum -a 256 -c "${{ matrix.archive }}.sha256"
          mkdir ../extracted
          tar -xzf "${{ matrix.archive }}" -C ../extracted
          cd ..
          executable="$(find extracted -type f -path '*/Contents/MacOS/DocMergeForge' -perm -111 -print -quit)"
          if [ -z "$executable" ]; then
            executable="$(find extracted -type f -name DocMergeForge -perm -111 -print -quit)"
          fi
          if [ -z "$executable" ]; then
            echo "Could not locate downloaded macOS onefile executable" >&2
            find extracted -maxdepth 6 -type f -print
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen "$executable" --packaged-smoke

      - name: Verify and launch Linux downloaded onefile
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd artifact
          sha256sum -c "${{ matrix.archive }}.sha256"
          mkdir ../extracted
          tar -xzf "${{ matrix.archive }}" -C ../extracted
          cd ..
          QT_QPA_PLATFORM=offscreen extracted/DocMergeForge --packaged-smoke
