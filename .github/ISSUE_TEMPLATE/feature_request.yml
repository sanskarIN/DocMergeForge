name: Feature request
description: Suggest a focused improvement to DocMergeForge.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - CLI
        - Desktop GUI
        - PDF engine
        - DOCX portable engine
        - LibreOffice fidelity/UNO acceptance
        - Microsoft Word fidelity/native acceptance
        - Discovery/order/validation
        - Project transaction/recovery
        - Reports/evidence
        - Packaging/distribution
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain inputs, outputs, expected user experience, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: Include cross-platform, fidelity, accessibility, privacy, recovery, or packaging checks when relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Project safety boundaries
      options:
        - label: This request keeps PDF and DOCX manuscript pipelines separate.
          required: true
        - label: This request does not require companion/source-code archives to be merged into manuscripts.
          required: true
        - label: Any external-office capability can remain non-production until its acceptance evidence is complete.
          required: true
